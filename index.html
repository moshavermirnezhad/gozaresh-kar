function showLogin(){document.getElementById('login').hidden=false;document.getElementById('pw').focus()}
function openApp(data){document.getElementById('home').style.display='none';document.getElementById('app').style.display='block';document.getElementById('frame').srcdoc=decode(data)}
function openStudent(){openApp(studentData)}
function loginConsultant(){if(document.getElementById('pw').value==='mirnezhad2026'){openApp(consultantData)}else{document.getElementById('err').textContent='رمز عبور اشتباه است.'}}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')loginConsultant()});

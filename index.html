function showLogin(){document.getElementById('login').hidden=false;document.getElementById('pw').focus()}
function openApp(data, studentCode){document.getElementById('home').style.display='none';document.getElementById('app').style.display='block';let html=decode(data);if(studentCode){const safe=JSON.stringify(studentCode).replace(/</g,'\\u003c');html=html.replace(/<head([^>]*)>/i,'<head$1><script>window.EMBEDDED_STUDENT_ID='+safe+';<\/script>');}document.getElementById('frame').srcdoc=html}
function openStudent(){const code=prompt('برای شروع، کد دانش‌آموزی خود را وارد کنید:');if(code===null)return;const clean=code.trim();if(!clean){alert('ورود کد دانش‌آموزی الزامی است.');return}openApp(studentData,clean)}
function loginConsultant(){if(document.getElementById('pw').value==='mirnezhad2026'){openApp(consultantData)}else{document.getElementById('err').textContent='رمز عبور اشتباه است.'}}
